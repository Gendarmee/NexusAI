services:
  #user-postgres
  user-postgres:
    container_name: user-postgres
    image: postgres:18
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${BASE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - user_pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER} -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 20

  user-postgres-exporter:
    container_name: user-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.0
    restart: always
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${BASE_POSTGRES_USER}:${USER_POSTGRES_PASSWORD}@user-postgres:5432?sslmode=disable"
    depends_on:
      user-postgres:
        condition: service_healthy


  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.6.4
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: ${BASE_POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm --metrics-enabled=true
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  #keyclaok-postgres
  keycloak-postgres:
    container_name: keycloak-postgres
    image: postgres:18
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${BASE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak_db
    volumes:
      - kc_pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER} -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 20

  #keyclaok-postgres-exporter
  keycloak-postgres-exporter:
    container_name: keycloak-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.0
    restart: always
    ports:
      - "9189:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${BASE_POSTGRES_USER}:${KC_POSTGRES_PASSWORD}@keycloak-postgres:5432/keycloak_db?sslmode=disable"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  #nexus
  nexus:
    container_name: nexus
    image: sonatype/nexus3:3.96.3
    restart: always
    ports:
      - "8081:8081"
    environment:
      NEXUS_SECURITY_INITIAL_PASSWORD: admin
      NEXUS_SECURITY_RANDOMPASSWORD: false
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status" ]
      interval: 5s
      timeout: 10s
      retries: 30

  #redis
  redis:
    container_name: redis
    image: redis:8.10.0
    restart: always
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes


  #alloy
  alloy:
    container_name: alloy
    image: grafana/alloy:v1.19.0
    restart: always
    ports:
      - "9080:9080" # HTTP interface
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP http
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - monitoring


  #loki
  loki:
    container_name: loki
    image: grafana/loki:3.1.0
    restart: always
    ports:
      - "3100:3100"
    networks:
      - monitoring

  #tempo
  tempo:
    container_name: tempo
    image: grafana/tempo:3.1.0-rc.1
    restart: always
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - monitoring


  #prometheus
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.0.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  #grafana
  grafana:
    container_name: grafana
    image: grafana/grafana:13.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    networks:
      - monitoring

  #nginx
  nginx:
    container_name: nginx
    image: nginx:alpine-slim


volumes:
  artifactory:
  user_pgdata:
  kc_pgdata:
  nexus-data:
  redis-data:
  tempo_data:
#networks
networks:
  monitoring:
    driver: bridge
