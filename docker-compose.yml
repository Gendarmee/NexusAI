services:
  user-postgres:
    container_name: user-postgres
    image: postgres:18
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${BASE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - user_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - monitoring

  user-postgres-exporter:
    container_name: user-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.0
    restart: always
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${BASE_POSTGRES_USER}:${USER_POSTGRES_PASSWORD}@user-postgres:5432?sslmode=disable"
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - monitoring

  keycloak-postgres:
    container_name: keycloak-postgres
    image: postgres:18
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${BASE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak_db
    volumes:
      - kc_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - monitoring

  keycloak-postgres-exporter:
    container_name: keycloak-postgres-exporter # Исправлена опечатка (было postgrews)
    image: prometheuscommunity/postgres-exporter:v0.20.0
    restart: always
    ports:
      - "9189:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${BASE_POSTGRES_USER}:${KC_POSTGRES_PASSWORD}@keycloak-postgres:5432/keycloak_db?sslmode=disable"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - monitoring

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.6.4
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: ${BASE_POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak # Важно для корректной работы за Nginx
    command: start-dev --import-realm --metrics-enabled=true
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - monitoring

  nexus:
    container_name: nexus
    image: sonatype/nexus3:3.96.3
    restart: always
    ports:
      - "8081:8081"
    environment:
      NEXUS_SECURITY_RANDOMPASSWORD: false
      NEXUS_CONTEXT: /nexus # Важно для корректной работы за Nginx
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks:
      - monitoring

  redis:
    container_name: redis
    image: redis:8.10.0
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - monitoring

  kafka:
    container_name: kafka
    image: apache/kafka:4.3.1
    restart: always
    ports:
      - "9092:9092"
    volumes:
      - ./infrastructure/kafka/server.properties:/etc/kafka/server.properties:ro
    networks:
      - monitoring

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.0.0
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  loki:
    container_name: loki
    image: grafana/loki:3.1.0
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./infrastructure/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring

  tempo:
    container_name: tempo
    image: grafana/tempo:3.1.0-rc.1
    restart: always
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4319:4317"
    networks:
      - monitoring

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.19.0
    restart: always
    ports:
      - "9080:9080"
      - "4317:4317"
      - "4318:4318"
    environment:
      LOKI_URL: ${LOKI_URL}
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      TEMPO_URL: ${TEMPO_URL}
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - monitoring

  grafana:
    container_name: grafana
    image: grafana/grafana:13.1
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./infrastructure/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - monitoring

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
      - keycloak
      - nexus
    networks:
      - monitoring

volumes:
  user_pgdata:
  kc_pgdata:
  nexus-data:
  redis-data:
  tempo_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge