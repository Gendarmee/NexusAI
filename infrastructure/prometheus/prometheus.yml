global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'user-postgres'
    static_configs:
      - targets: ['user-postgres-exporter:9187']

  - job_name: 'keycloak-postgres'
    static_configs:
      - targets: ['keycloak-postgres-exporter:9187']

  - job_name: 'keycloak'
    metrics_path: '/keycloak/metrics'
    static_configs:
      - targets: ['keycloak:9000']

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:9080']